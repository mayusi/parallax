<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Parallax">
  <title>Parallax</title>
  <defs>
    <linearGradient id="px-space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1128"/>
      <stop offset="1" stop-color="#020307"/>
    </linearGradient>
    <radialGradient id="px-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B3DF5" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#2436B0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="px-aura" cx="128" cy="128" r="74" gradientUnits="userSpaceOnUse">
      <stop offset="0.40" stop-color="#7FE9FF" stop-opacity="0"/>
      <stop offset="0.47" stop-color="#9DF4FF" stop-opacity="0.55"/>
      <stop offset="0.62" stop-color="#6B7BFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3A2AB0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="px-disk" x1="-110" y1="0" x2="110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#B8F8FF"/>
      <stop offset="0.65" stop-color="#5C86FF"/>
      <stop offset="1" stop-color="#6A3DF0"/>
    </linearGradient>
    <linearGradient id="px-ring" x1="94" y1="0" x2="162" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C9F9FF"/>
      <stop offset="1" stop-color="#8F7DFF"/>
    </linearGradient>
    <linearGradient id="px-jet-up" x1="0" y1="-30" x2="0" y2="-120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FDFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#5EEBFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="px-jet-down" x1="0" y1="30" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FDFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="px-back"><rect x="-150" y="-150" width="300" height="150"/></clipPath>
    <clipPath id="px-front"><rect x="-150" y="0" width="300" height="150"/></clipPath>
    <filter id="px-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="px-blur-s" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#px-space)"/>
  <circle cx="128" cy="128" r="122" fill="url(#px-halo)"/>
  <g fill="#CFD8FF">
    <circle cx="40" cy="46" r="1.3" opacity="0.7"/>
    <circle cx="216" cy="38" r="1.6" opacity="0.85"/>
    <circle cx="228" cy="156" r="1" opacity="0.5"/>
    <circle cx="28" cy="138" r="1.1" opacity="0.5"/>
    <circle cx="204" cy="222" r="1.3" opacity="0.6"/>
    <circle cx="54" cy="214" r="1" opacity="0.45"/>
    <circle cx="170" cy="24" r="0.9" opacity="0.5"/>
  </g>
  <g transform="translate(128 128) rotate(-14)">
    <polygon points="-12,-28 12,-28 2.5,-112 -2.5,-112" fill="url(#px-jet-up)" filter="url(#px-blur)" opacity="0.75"/>
    <polygon points="-12,28 12,28 2.5,112 -2.5,112" fill="url(#px-jet-down)" filter="url(#px-blur)" opacity="0.75"/>
    <polygon points="-4.5,-28 4.5,-28 1,-122 -1,-122" fill="url(#px-jet-up)"/>
    <polygon points="-4.5,28 4.5,28 1,122 -1,122" fill="url(#px-jet-down)"/>
    <g clip-path="url(#px-back)" fill="none" stroke="url(#px-disk)">
      <ellipse rx="112" ry="27" stroke-width="2" stroke-opacity="0.3"/>
      <ellipse rx="92" ry="21" stroke-width="12" stroke-opacity="0.7" filter="url(#px-blur-s)"/>
      <ellipse rx="92" ry="21" stroke-width="5"/>
      <ellipse rx="72" ry="16" stroke-width="2.5" stroke-opacity="0.8"/>
    </g>
  </g>
  <circle cx="128" cy="128" r="74" fill="url(#px-aura)"/>
  <g transform="rotate(-14 128 128)" fill="none">
    <path d="M 88 132 A 40 40 0 0 1 168 132" stroke="#BFF8FF" stroke-width="9" opacity="0.75" filter="url(#px-blur-s)"/>
    <path d="M 88 132 A 40 40 0 0 1 168 132" stroke="url(#px-ring)" stroke-width="4"/>
    <path d="M 164 128 A 36 36 0 0 1 92 128" stroke="#9DF4FF" stroke-width="1.6" opacity="0.45"/>
  </g>
  <circle cx="128" cy="128" r="33" fill="none" stroke="#9DF4FF" stroke-width="7" opacity="0.6" filter="url(#px-blur-s)"/>
  <circle cx="128" cy="128" r="30" fill="#000000"/>
  <circle cx="128" cy="128" r="31" fill="none" stroke="url(#px-ring)" stroke-width="2.6"/>
  <g transform="translate(128 128) rotate(-14)">
    <g clip-path="url(#px-front)" fill="none" stroke="url(#px-disk)">
      <ellipse rx="112" ry="27" stroke-width="2" stroke-opacity="0.3"/>
      <ellipse rx="92" ry="21" stroke-width="13" stroke-opacity="0.8" filter="url(#px-blur-s)"/>
      <ellipse rx="92" ry="21" stroke-width="5.5"/>
      <ellipse rx="72" ry="16" stroke-width="2.5" stroke="#FFFFFF" stroke-opacity="0.85"/>
    </g>
  </g>
</svg>
