<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Grading</title>
<style>
  :root {
    --bg: #0d0d10; --panel: #15151a; --panel2: #1c1c23; --line: #2a2a33; --fg: #e9e6e1; --dim: #8d8a93;
    --accent: #c8102e; --accent2: #e6b84c; --ok: #6fbf73; --chip: #24242c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  header { height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: linear-gradient(#17171c, #121216); }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
  header h1 b { color: var(--accent); }
  .progress { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  .progress b { color: var(--accent2); }
  main { display: grid; grid-template-columns: 220px 1fr 340px; height: calc(100% - 52px); }
  #list { border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .cand { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .cand:hover { border-color: #4a4a55; }
  .cand.on { border-color: var(--accent); background: #22161a; }
  .cand .lab { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cand .sc { font-variant-numeric: tabular-nums; min-width: 38px; text-align: center; padding: 2px 6px; border-radius: 5px;
    background: var(--chip); color: var(--dim); font-weight: 600; }
  .cand .sc.has { background: #2b2414; color: var(--accent2); }
  #stage { position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bar { position: absolute; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
  .bar.top { top: 12px; } .bar.bottom { bottom: 12px; }
  .grp { display: flex; gap: 2px; background: rgba(20,20,26,.86); border: 1px solid var(--line); border-radius: 8px; padding: 3px;
    pointer-events: auto; backdrop-filter: blur(6px); }
  .grp span { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; padding: 6px 6px 0 6px; }
  .btn { background: transparent; color: var(--fg); border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: #2a2a33; }
  .btn.on { background: #3a1d24; color: #ffd9de; }
  .lbl { position: absolute; top: 58px; font-weight: 800; font-size: 20px; letter-spacing: .04em; color: #fff;
    text-shadow: 0 2px 8px #000; pointer-events: none; }
  #labA { left: 18px; } #labB { left: calc(50% + 18px); display: none; }
  .hint { position: absolute; right: 14px; bottom: 58px; color: var(--dim); font-size: 12px; text-align: right; pointer-events: none; }
  aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); font-weight: 600; }
  .refimg { width: 100%; height: 230px; object-fit: contain; background: #e9e7e3; border-radius: 6px; }
  .reftabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .noref { color: var(--dim); font-size: 13px; }
  .score-big { font-size: 46px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; color: var(--accent2); line-height: 1; }
  .score-big small { font-size: 16px; color: var(--dim); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 10px 0 6px; }
  .quick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .quick button { background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 0; cursor: pointer;
    font-variant-numeric: tabular-nums; }
  .quick button:hover { border-color: var(--accent); }
  textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; }
  .save { flex: 1; background: var(--accent); color: #fff; border: 0; border-radius: 7px; padding: 10px; font-weight: 700; cursor: pointer; }
  .nav { background: var(--chip); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 14px; cursor: pointer; }
  .status { color: var(--dim); font-size: 12px; min-height: 16px; }
  .status.ok { color: var(--ok); }
  select { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Owner <b>Grading</b></h1>
  <div id="roundName" style="color:var(--dim)"></div>
  <div class="progress" id="progress"></div>
</header>
<main>
  <nav id="list"></nav>
  <section id="stage">
    <canvas id="view"></canvas>
    <div id="loading">loading…</div>
    <div class="lbl" id="labA"></div><div class="lbl" id="labB"></div>
    <div class="bar top">
      <div class="grp"><span>View</span>
        <button class="btn" data-view="q34">3/4</button><button class="btn" data-view="front">Front</button>
        <button class="btn" data-view="side">Side</button><button class="btn" data-view="back">Back</button>
        <button class="btn" data-view="top">Top</button></div>
      <div class="grp"><span>Look</span>
        <button class="btn on" data-look="tex">Textured</button><button class="btn" data-look="clay">Clay</button>
        <button class="btn" data-look="wire">Wire</button></div>
      <div class="grp"><span>Light</span>
        <button class="btn on" data-light="studio">Studio</button><button class="btn" data-light="bright">Bright</button>
        <button class="btn" data-light="moody">Moody</button></div>
    </div>
    <div class="bar bottom">
      <div class="grp"><button class="btn" id="tRot">Auto-rotate</button><button class="btn" id="tR6">R6 scale</button>
        <button class="btn on" id="tGrid">Stud grid</button></div>
      <div class="grp"><button class="btn" id="tCmp">Compare</button><select id="cmpSel" title="compare with"></select></div>
    </div>
    <div class="hint">drag = orbit · right-drag = pan · wheel = zoom<br>← → model · 1-5 views · T/C/W look · R rotate · M R6 · X compare</div>
  </section>
  <aside>
    <div class="card"><h2>Its references</h2><div class="reftabs" id="reftabs"></div><img class="refimg" id="refimg" alt="reference"><div class="noref" id="noref"></div></div>
    <div class="card">
      <h2>Your score — <span id="curLab"></span></h2>
      <div class="score-big"><span id="scoreNum">–</span><small> / 10</small></div>
      <input type="range" id="score" min="0" max="10" step="0.5" value="5">
      <div class="quick" id="quick"></div>
    </div>
    <div class="card"><h2>Your words</h2><textarea id="words" placeholder="what works, what doesn't — your words go into the record with the score"></textarea></div>
    <div class="row"><button class="nav" id="prev">←</button><button class="save" id="save">Save &amp; next</button><button class="nav" id="next">→</button></div>
    <div class="status" id="status"></div>
  </aside>
</main>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module" src="./app.js"></script>
</body>
</html>
